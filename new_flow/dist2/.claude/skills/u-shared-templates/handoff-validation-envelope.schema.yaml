$schema: "http://json-schema.org/draft-07/schema#"
$id: "u-shared-templates/handoff-validation-envelope.schema.yaml"
title: handoff-validation-envelope
description: >
  Structured result of validating a handoff-manifest.yaml against schema and
  semantic rules. Produced by u-handoff-validator. Consumed by the caller that
  requested the validation (BE/FE/Spec orchestrator). No free text; the caller
  acts on rule IDs, not on error messages.
type: object
required:
  - validation_envelope
  - status
  - checks
  - errors
  - warnings
additionalProperties: false
properties:
  validation_envelope:
    type: object
    required: [validated_by, timestamp, caller, layer]
    additionalProperties: false
    properties:
      validated_by:
        type: string
        const: "u-handoff-validator"
      timestamp:
        type: string
        pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$"
      manifest_id:
        type: string
        pattern: "^HANDOFF-[0-9]{8}-[0-9]{6}$"
      manifest_sha256:
        type: string
        pattern: "^[a-f0-9]{64}$"
      caller:
        type: string
        enum:
          - u-be-orchestrator-core
          - u-fe-orchestrator-core
          - u-spec-orchestrator
      layer:
        type: string
        const: "ephemeral"
  status:
    type: string
    enum: [valid, invalid]
  checks:
    type: array
    items:
      type: object
      required: [rule, status, severity]
      additionalProperties: false
      properties:
        rule:
          type: string
          pattern: "^(FLOW|HDF)-[0-9]{3}$"
        status:
          type: string
          enum: [pass, fail]
        severity:
          type: string
          enum: [blocking, warning]
  errors:
    type: array
    items:
      type: object
      required: [rule, message]
      additionalProperties: false
      properties:
        rule:
          type: string
          pattern: "^(FLOW|HDF)-[0-9]{3}$"
        message:
          type: string
        path:
          type: string
          description: "JSONPath into the manifest document"
  warnings:
    type: array
    items:
      type: object
      required: [rule, message]
      additionalProperties: false
      properties:
        rule:
          type: string
          pattern: "^(FLOW|HDF)-[0-9]{3}$"
        message:
          type: string
        path:
          type: string
if:
  properties:
    status:
      const: valid
  required: [status]
then:
  properties:
    errors:
      maxItems: 0
