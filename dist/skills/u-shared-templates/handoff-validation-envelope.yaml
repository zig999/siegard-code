# handoff-validation-envelope — canonical template
# Produced by: u-handoff-validator
# Consumed by: u-be-orchestrator-core, u-fe-orchestrator-core, u-spec-orchestrator
# Schema: .claude/skills/u-shared-templates/handoff-validation-envelope.schema.yaml
# Layer: ephemeral — never persisted; held in the caller's session state only
# Rules:
#   - status: valid requires errors: []
#   - checks[] lists every rule executed, pass or fail
#   - errors[] contains only blocking failures; warnings[] contains non-blocking ones
#   - The caller acts on rule IDs; do not parse message text

validation_envelope:
  validated_by: u-handoff-validator
  timestamp: <YYYY-MM-DDTHH:MM:SSZ>
  manifest_id: HANDOFF-<YYYYMMDD-HHMMSS>
  manifest_sha256: <64-char sha256 of manifest file>
  caller: u-be-orchestrator-core | u-fe-orchestrator-core | u-spec-orchestrator
  layer: ephemeral

status: valid | invalid

checks:
  - rule: FLOW-030
    status: pass
    severity: blocking
  - rule: FLOW-031
    status: pass
    severity: blocking

errors:
  - rule: HDF-020
    message: "sha256 mismatch for backend_package entry"
    path: $.backend_package[0].sha256

warnings: []
