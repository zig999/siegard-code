# IMPROVE id pattern violation: lowercase + missing timestamp segments
handoff_envelope:
  id: improve-bad
  source: u-improve
  invocation_source: u-improve
  improve_session: subjects-fe-review
  improvement_task: "task"
  mode_hint: "fast-track:minor"
  affected_specs:
    - path: "front/features/subject-detail.feature.spec.md"
      sections: ["§2"]
      change_summary: "summary"
  estimated_task_contracts: 1
  return_contract:
    write_to: "{SESSIONS_DIR}/subjects-fe-review/log-orchestrator-dev.md"
    update_field: spec_change_status
    expected_terminal_states: [completed, failed]
